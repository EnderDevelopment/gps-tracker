<!DOCTYPE html>
<html>
<head>
    <title>GPS Tracker</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="container">
        <h1>GPS Tracker</h1>
        <div class="form">
            <input type="text" id="trackerName" placeholder="Tracker Name">
            <input type="text" id="frequency" placeholder="Frequency">
            <button id="createTracker">Create Tracker</button>
            <button id="joinTracker">Join Tracker</button>
            <button id="pingTracker">Ping Tracker</button>
        </div>
        <div class="trackers" id="trackers"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
